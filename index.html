<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MyPayTracker</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#F7F8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121715" media="(prefers-color-scheme: dark)" />
    <script>
      // THEME-01jm-T04: aplica el tema guardado antes de pintar para no parpadear. Sin elección
      // no pone nada y el CSS sigue a prefers-color-scheme. Misma clave que ThemeToggle.tsx.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
